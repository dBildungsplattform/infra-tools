name: cron-tools Docker Image on tag to GHCR

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
    paths:
      - "cron-tools/**"

concurrency:
  group: cron-tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_image_on_push:
    permissions:
      packages: write
      security-events: write
      contents: read
    uses: dBildungsplattform/dbp-github-workflows/.github/workflows/image-publish-trivy.yaml@OPS-11677_CronToolsAuto #to be changed to @8 --- IGNORE ---
    with:
      image_name: "cron-tools"
      context: "./cron-tools/"
      image_tag_generation: "version_git_tag"
      add_latest_tag: false
      container_registry: "ghcr.io"
      run_trivy_scan: true
      run_clamav_scan: true
      limit-severities-for-sarif: false
