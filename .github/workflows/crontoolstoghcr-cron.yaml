name: Docker Image generation for crontools Cron Job

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 14 * *"

concurrency:
  group: cron-tools-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_image_on_push:
    permissions:
      packages: write
      security-events: write
      contents: read
    uses: dBildungsplattform/dbp-github-workflows/.github/workflows/image-publish-trivy.yaml@OPS-11677_CronToolsAuto2 #to be changed to @8 --- IGNORE ---
    with:
      image_name: "cron-tools"
      context: "./cron-tools/"
      image_tag_generation: "monthly_schedule_tag"
      add_latest_tag: false
      container_registry: "ghcr.io"
      run_trivy_scan: true
      run_clamav_scan: true
      limit-severities-for-sarif: false