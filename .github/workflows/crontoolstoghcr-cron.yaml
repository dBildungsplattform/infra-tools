name: Docker Image generation for crontools Cron Job

on:
  workflow_dispatch:
  schedule:
    - cron: "20 13 14 * *"
      timezone: "Europe/Berlin"

concurrency:
  group: cron-tools-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_monthly_image:
    permissions:
      packages: write
      security-events: write
      contents: read
    uses: dBildungsplattform/dbp-github-workflows/.github/workflows/image-publish-trivy.yaml@8
    with:
      image_name: "cron-tools"
      context: "./cron-tools/"
      image_tag_generation: "specified"
      image_tag: "Monthly_{{date 'YYYY-MM'}}"
      add_latest_tag: false
      container_registry: "ghcr.io"
      run_trivy_scan: true
      run_clamav_scan: true
      limit-severities-for-sarif: false