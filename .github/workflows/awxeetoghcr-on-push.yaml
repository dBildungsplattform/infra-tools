name: awx-ee Docker Image on Push to GHCR

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    paths:
      - "awx-ee/**"
concurrency:
  group: awx-ee-${{ github.ref }}
  cancel-in-progress: true
jobs:
  generate_dockerfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install ansible-builder
        run: pip install ansible-builder==3.1.1
      - name: build Dockerfile from execution-environment.yml
        working-directory: awx-ee
        run: ansible-builder create --output-filename Dockerfile
      # see https://github.com/actions/upload-artifact#permission-loss
      - name: tar files
        run: tar -cvf build-code.tar -C awx-ee/context .
      - name: upload build context
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          path: build-code.tar
          archive: false
          retention-days: 1

  build_image_on_push:
    needs: generate_dockerfile
    permissions:
      packages: write
      security-events: write
      contents: read
    uses: dBildungsplattform/dbp-github-workflows/.github/workflows/image-publish-trivy.yaml@OPS-11278
    with:
      image_name: "awx-ee"
      context: "./awx-ee/"
      #todo: change
      image_tag_generation: "specified"
      code_source: "artifact"
      #todo: remove
      image_tag: "awx-ee-2.4.2"
      add_latest_tag: false
      container_registry: "ghcr.io"
      run_trivy_scan: true
      run_clamav_scan: true
      limit-severities-for-sarif: false
      # todo: remove when terraform has been migrated to more recent opentofu version (should hopefully to no critical findings)
      fail_on_vulnerabilites: false

